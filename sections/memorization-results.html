<section id="visual-results" class="section-padding">
  <div class="content-width">
    <h2 class="section-heading">1-Min Results</h2>
    <p class="caption-text" style="text-align: center; margin-bottom: 0.5rem;">Minute-long memory recall.</p>
    <p class="caption-text" style="margin-bottom: 2rem; text-align: center;">
      Select a scene, then click models in the comparison strip to inspect them in detail below.<br>Check the memory box to see our memory readout visuals.
    </p>

    <!-- Interactive player instance (scenes: window.VP_SCENE_SETS.oneMin) -->
    <div class="vr-player" data-scenes="oneMin">

      <!-- ═══ Zone 1: Example Selector ═══ -->
      <div class="example-selector-wrap" id="example-selector-wrap">
        <div class="example-selector" id="example-selector">
          <!-- Cards populated by JS -->
        </div>
      </div>

      <!-- ═══ Zone 2: Model Strip ═══ -->
      <div class="model-strip" id="model-strip">
        <div class="model-strip-item" data-model="nstm">
          <div class="model-strip-video-wrap">
            <video autoplay loop muted playsinline></video>
            <div class="model-strip-check" aria-hidden="true">✓</div>
          </div>
          <span class="model-strip-label">NSTM 256×256</span>
        </div>
        <div class="model-strip-item" data-model="nstm_hires">
          <div class="model-strip-video-wrap">
            <video autoplay loop muted playsinline></video>
            <div class="model-strip-check" aria-hidden="true">✓</div>
          </div>
          <span class="model-strip-label">NSTM 512×512</span>
        </div>
        <div class="model-strip-item" data-model="token_mem">
          <div class="model-strip-video-wrap">
            <video autoplay loop muted playsinline></video>
            <div class="model-strip-check" aria-hidden="true">✓</div>
          </div>
          <span class="model-strip-label">Token-Mem</span>
        </div>
        <div class="model-strip-item" data-model="full_attn">
          <div class="model-strip-video-wrap">
            <video autoplay loop muted playsinline></video>
            <div class="model-strip-check" aria-hidden="true">✓</div>
          </div>
          <span class="model-strip-label">LVSM</span>
        </div>
        <div class="model-strip-item" data-model="lact_nvs">
          <div class="model-strip-video-wrap">
            <video autoplay loop muted playsinline></video>
            <div class="model-strip-check" aria-hidden="true">✓</div>
          </div>
          <span class="model-strip-label">LACT-NVS</span>
        </div>
      </div>

      <!-- ═══ Zone 3: Analysis Box ═══ -->
      <div class="analysis-box" id="analysis-box">

        <!-- Single-model view: Input | Rendered | Memory (optional) -->
        <div class="analysis-row" id="analysis-single" style="display:none;">
          <!-- Column 1: Input (single video, two stacked views) -->
          <div class="analysis-col analysis-col--input" id="analysis-col-input">
            <video id="analysis-input-video" autoplay loop muted playsinline></video>
            <span class="vid-label">Input</span>
          </div>
          <!-- Column 2: Rendered output -->
          <div class="analysis-col analysis-col--rendered" id="analysis-col-rendered">
            <video id="analysis-model-video" autoplay loop muted playsinline></video>
            <span class="vid-label" id="analysis-model-label"></span>
            <!-- Memory toggle: checkbox overlay, top-right corner -->
            <label class="memory-toggle" id="memory-toggle" style="display:none;">
              <input type="checkbox" class="memory-toggle-checkbox" id="memory-checkbox">
              <span class="memory-toggle-text">Memory</span>
            </label>
          </div>
          <!-- Column 3: Memory (conditional) -->
          <div class="analysis-col analysis-col--memory" id="analysis-col-memory" style="display:none;">
            <video id="analysis-memory-video" autoplay loop muted playsinline></video>
            <span class="vid-label">Memory</span>
          </div>
        </div>

        <!-- Comparison (swipe) view: Input | Swipe -->
        <div class="analysis-row" id="analysis-compare" style="display:none;">
          <!-- Column 1: Input -->
          <div class="analysis-col analysis-col--input" id="compare-col-input">
            <video id="compare-input-video" autoplay loop muted playsinline></video>
            <span class="vid-label">Input</span>
          </div>
          <!-- Column 2: Swipe comparison -->
          <div class="analysis-col analysis-col--compare compare-container" id="compare-container">
            <video class="compare-video compare-video--under" id="compare-video-under" autoplay loop muted playsinline></video>
            <video class="compare-video compare-video--over" id="compare-video-over" autoplay loop muted playsinline></video>
            <div class="compare-divider" id="compare-divider">
              <div class="compare-divider-line"></div>
              <div class="compare-divider-handle">⇔</div>
            </div>
            <span class="vid-label vid-label--left" id="compare-label-left"></span>
            <span class="vid-label vid-label--right" id="compare-label-right"></span>
          </div>
        </div>

        <!-- Playback Controls -->
        <div class="playback-controls" id="playback-controls">
          <button class="playback-btn playback-btn--play" id="playback-toggle" title="Pause">
            <svg class="icon-pause" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <rect x="3" y="2" width="4" height="12" rx="1" />
              <rect x="9" y="2" width="4" height="12" rx="1" />
            </svg>
            <svg class="icon-play" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:none">
              <path d="M4 2.5v11l9-5.5z" />
            </svg>
          </button>
          <div class="playback-seek-wrap">
            <input type="range" class="playback-seek" id="playback-seek" min="0" max="1000" value="0" step="1">
            <div class="playback-seek-fill" id="playback-seek-fill"></div>
          </div>
          <span class="playback-time" id="playback-time">0:00 / 0:00</span>
        </div>
      </div>
    </div>
  </div>
</section>
